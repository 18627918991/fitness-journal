<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>学员端 · 健身私教管理系统</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--primary:#2563eb;--primary-soft:#dbeafe;--shadow:0 12px 32px rgba(15,23,42,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 32%,var(--bg) 100%);color:var(--text)}
    header{position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);background:rgba(245,247,251,.86);border-bottom:1px solid rgba(229,231,235,.85)}
    .topbar{max-width:860px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
    h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
    .header-right{display:flex;align-items:center;gap:10px}
    .user-badge{background:var(--primary-soft);color:#1d4ed8;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800}
    button{border:none;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;transition:.18s ease;background:#111827;color:#fff;font-family:inherit;font-size:13px}
    button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.12)}
    button.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
    button.primary{background:var(--primary)}button.danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    button.small{padding:6px 10px;font-size:12px;border-radius:10px}
    .tabs{max-width:860px;margin:0 auto;padding:0 18px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
    .tab{padding:12px 18px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab-content{display:none}.tab-content.active{display:block}
    main{max-width:860px;margin:0 auto;padding:22px 18px 70px}
    .card{background:rgba(255,255,255,.94);border:1px solid rgba(229,231,235,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
    .card h2{font-size:17px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}
    .pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--primary-soft);color:#1d4ed8;font-size:12px;font-weight:900}
    label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin-bottom:5px}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font:inherit;background:#fff;outline:none}
    input:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(147,197,253,.12)}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .booking-item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .booking-title{font-weight:950;font-size:15px}.booking-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.8}
    .status-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
    .status-pending{background:#fef3c7;color:#92400e}.status-confirmed{background:#dbeafe;color:#1d4ed8}
    .status-completed{background:#dcfce7;color:#166534}.status-cancelled{background:#f3f4f6;color:#6b7280}
    .log-item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;margin-bottom:10px}
    .log-title{font-weight:950;font-size:16px;margin-bottom:6px}
    .log-meta{font-size:12px;color:var(--muted);line-height:1.9}
    .log-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    .stat-mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f9fafb}
    .stat-mini .n{font-size:11px;color:var(--muted);font-weight:800}
    .stat-mini .v{font-size:18px;font-weight:950;margin-top:4px}
    .ex-chip{display:inline-block;background:#f3f4f6;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin:3px 2px;color:#374151}
    .empty{text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:18px;padding:24px;background:#fff}
    .toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 12px 24px rgba(15,23,42,.25);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:100;font-size:13px}
    .toast.show{opacity:1;transform:translateY(0)}
    .time-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
    .slot{border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;transition:.15s;background:#fff}
    .slot:hover{border-color:var(--primary);color:var(--primary)}
    .slot.selected{border-color:var(--primary);background:var(--primary-soft);color:#1d4ed8}
    /* progress compare */
    .compare-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
    .compare-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .compare-card .cc-label{font-size:12px;color:var(--muted);font-weight:900}
    .compare-card .cc-vals{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
    .compare-card .cc-from{font-size:14px;color:var(--muted);font-weight:700}.compare-card .cc-arrow{color:var(--muted)}
    .compare-card .cc-to{font-size:22px;font-weight:950}
    .compare-card .cc-delta{margin-top:8px;font-size:13px;font-weight:900;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px}
    .cc-delta.up{background:#dcfce7;color:#166534}.cc-delta.down{background:#dbeafe;color:#1d4ed8}
    .cc-delta.bad{background:#fee2e2;color:#991b1b}.cc-delta.flat{background:#f3f4f6;color:#6b7280}
    .chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
    .chart-card h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
    .chart-card .ch-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
    .chart-card svg{width:100%;height:auto;display:block}
    @media(max-width:560px){.form-grid,.log-stats,.time-slots{grid-template-columns:repeat(2,1fr)}.booking-item{flex-direction:column;align-items:flex-start}}
  </style>
  <link rel="stylesheet" href="/theme.css"/>
</head>
<body class="app-page student-page">
<header>
  <div class="topbar">
    <div class="brand"><div class="logo">🏋️</div><div><h1>健身私教管理系统</h1><div class="sub">学员端</div></div></div>
    <div class="header-right">
      <span class="user-badge" id="userBadge">加载中…</span>
      <button class="secondary small" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('book')">📅 预约课程</div>
    <div class="tab" onclick="switchTab('mybookings')">🗓️ 我的约课</div>
    <div class="tab" onclick="switchTab('records')">📊 训练记录</div>
    <div class="tab" onclick="switchTab('progress')">📈 我的进步</div>
  </div>
</header>

<!-- 预约课程 -->
<div id="tab-book" class="tab-content active">
<main>
  <div class="card">
    <h2>预约私教课</h2>
    <div class="form-grid" style="margin-bottom:14px">
      <div><label>选择教练</label><select id="coachSelect"><option value="">-- 请选择教练 --</option></select></div>
      <div><label>上课日期</label><input type="date" id="bookDate"></div>
    </div>
    <div><label>选择时间段</label>
      <div class="time-slots" id="timeSlots">
        <div class="slot" onclick="selectSlot(this,'09:00')">09:00</div>
        <div class="slot" onclick="selectSlot(this,'10:00')">10:00</div>
        <div class="slot" onclick="selectSlot(this,'11:00')">11:00</div>
        <div class="slot" onclick="selectSlot(this,'14:00')">14:00</div>
        <div class="slot" onclick="selectSlot(this,'15:00')">15:00</div>
        <div class="slot" onclick="selectSlot(this,'16:00')">16:00</div>
        <div class="slot" onclick="selectSlot(this,'18:00')">18:00</div>
        <div class="slot" onclick="selectSlot(this,'19:00')">19:00</div>
      </div>
    </div>
    <div style="margin-top:14px"><label>备注（可选）</label><input type="text" id="bookNote" placeholder="想训练的部位或特殊说明"></div>
    <div style="margin-top:14px;text-align:right"><button class="primary" onclick="submitBooking()">提交预约</button></div>
  </div>
</main>
</div>

<!-- 我的约课 -->
<div id="tab-mybookings" class="tab-content">
<main>
  <div class="card">
    <h2>我的约课 <button class="secondary small" onclick="loadMyBookings()">刷新</button></h2>
    <div id="myBookingList"><div class="empty">加载中…</div></div>
  </div>
</main>
</div>

<!-- 训练记录 -->
<div id="tab-records" class="tab-content">
<main>
  <div class="card" style="padding-bottom:12px">
    <h2>训练记录 <span class="pill" id="recordCount">0 条</span></h2>
    <div class="form-grid" style="margin-bottom:0">
      <div><label>按月份筛选</label><input type="month" id="recordMonth" onchange="loadRecords()"></div>
    </div>
  </div>
  <div id="recordList"><div class="empty">加载中…</div></div>
</main>
</div>

<!-- 我的进步 -->
<div id="tab-progress" class="tab-content">
<main>
  <div class="card" style="margin-bottom:18px">
    <h2>我的进步 <span class="pill">前后变化 + 趋势</span></h2>
    <div class="form-grid" style="margin-bottom:0">
      <div><label>时间范围</label>
        <select id="progRange" onchange="renderProgress()">
          <option value="30">近 1 个月</option>
          <option value="90">近 3 个月</option>
          <option value="180">近半年</option>
          <option value="all" selected>全部</option>
        </select>
      </div>
    </div>
    <div class="footer-note" style="margin-top:10px;color:var(--muted);font-size:12px">对比基于教练记录的体重 / 体脂率 / 骨骼肌，以及每次训练容量。</div>
  </div>
  <div id="progSummary"></div>
  <div id="progCharts"></div>
  <div id="progEmpty" class="card"><div class="empty">还没有足够的训练数据，完成几次训练后这里会显示你的成长曲线。</div></div>
</main>
</div>

<div class="toast" id="toast"></div>
<script>
let me=null, selectedSlot='';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function statusLabel(s){return{pending:'待确认',confirmed:'已确认',completed:'已完课',cancelled:'已取消'}[s]||s}
async function api(path,opt={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
async function logout(){await api('/auth/logout',{method:'POST'});location.href='/login.html'}

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['book','mybookings','records','progress'][i]===name)});
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='mybookings')loadMyBookings();
  if(name==='records')loadRecords();
  if(name==='progress')loadProgress();
}

async function init(){
  try{
    me=await api('/auth/me');
    document.getElementById('userBadge').textContent='👋 '+me.name;
    // 设置默认日期为明天
    const d=new Date();d.setDate(d.getDate()+1);
    document.getElementById('bookDate').value=d.toISOString().slice(0,10);
    // 加载教练列表
    const coaches=await api('/users/coaches');
    coaches.forEach(c=>{document.getElementById('coachSelect').innerHTML+=`<option value="${c.id}">${esc(c.name)}</option>`});
  }catch(e){location.href='/login.html'}
}

function selectSlot(el,slot){
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
  selectedSlot=slot;
}

async function submitBooking(){
  const coach_id=document.getElementById('coachSelect').value;
  const date=document.getElementById('bookDate').value;
  const note=document.getElementById('bookNote').value;
  if(!coach_id){toast('请选择教练');return}
  if(!date){toast('请选择日期');return}
  if(!selectedSlot){toast('请选择时间段');return}
  try{
    await api('/bookings',{method:'POST',body:JSON.stringify({coach_id,date,time_slot:selectedSlot,note})});
    toast('预约成功，等待教练确认');
    document.getElementById('bookNote').value='';
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));
    selectedSlot='';
  }catch(e){toast(e.message)}
}

async function loadMyBookings(){
  try{
    const list=await api('/bookings');
    document.getElementById('myBookingList').innerHTML=list.length
      ?list.map(b=>`<div class="booking-item">
        <div>
          <div class="booking-title">📅 ${esc(b.date)} ${esc(b.time_slot)} · ${esc(b.coach_name)}教练 <span class="status-badge status-${b.status}">${statusLabel(b.status)}</span></div>
          <div class="booking-meta">${b.note?'备注：'+esc(b.note):'无备注'}</div>
        </div>
        ${b.status==='pending'?`<button class="danger small" onclick="cancelBooking(${b.id})">取消</button>`:''}
      </div>`).join('')
      :'<div class="empty">暂无约课记录</div>';
  }catch(e){toast('加载失败')}
}

async function cancelBooking(id){
  if(!confirm('确定取消这次约课吗？'))return;
  try{await api('/bookings/'+id+'/cancel',{method:'PUT'});toast('已取消');loadMyBookings();}
  catch(e){toast(e.message)}
}

async function loadRecords(){
  const month=document.getElementById('recordMonth').value;
  try{
    const logs=await api('/logs'+(month?'?month='+month:''));
    document.getElementById('recordCount').textContent=logs.length+' 条';
    document.getElementById('recordList').innerHTML=logs.length
      ?logs.map(l=>{
        const exNames=(l.exercises||[]).map(e=>`<span class="ex-chip">${esc(e.name)}</span>`).join('');
        return`<div class="log-item">
          <div class="log-title">${esc(l.date)} ${esc(l.weekday||'')} · ${esc(l.title||'训练日志')}</div>
          <div class="log-meta">教练：${esc(l.coach_name)}</div>
          <div class="log-stats">
            <div class="stat-mini"><div class="n">动作数</div><div class="v">${(l.exercises||[]).length}</div></div>
            <div class="stat-mini"><div class="n">耗时</div><div class="v">${l.duration||'—'}<small style="font-size:12px"> min</small></div></div>
            <div class="stat-mini"><div class="n">消耗</div><div class="v">${l.calories||'—'}<small style="font-size:12px"> kcal</small></div></div>
            <div class="stat-mini"><div class="n">体重</div><div class="v">${l.body_weight||'—'}<small style="font-size:12px"> kg</small></div></div>
          </div>
          ${exNames?`<div style="margin-top:10px">${exNames}</div>`:''}
          ${l.summary?`<div style="margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7">${esc(l.summary)}</div>`:''}
        </div>`;
      }).join('')
      :'<div class="empty">暂无训练记录</div>';
  }catch(e){toast('加载失败')}
}

// ── 我的进步 ──
const BODY_METRICS=[
  {key:'body_weight',label:'体重',unit:'kg',good:'neutral',color:'#2563eb'},
  {key:'body_fat',label:'体脂率',unit:'%',good:'down',color:'#f59e0b'},
  {key:'body_muscle',label:'骨骼肌',unit:'kg',good:'up',color:'#16a34a'},
];
let progData=[], progLoaded=false;

async function loadProgress(){
  if(!me)return;
  try{progData=await api('/logs/progress/'+me.id);progLoaded=true;}catch(e){progData=[];}
  renderProgress();
}

function progFilterRange(list){
  const r=document.getElementById('progRange').value;
  if(r==='all')return list;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-Number(r));
  const cut=cutoff.toISOString().slice(0,10);
  return list.filter(l=>(l.date||'')>=cut);
}

function renderProgress(){
  const summary=document.getElementById('progSummary');
  const charts=document.getElementById('progCharts');
  const empty=document.getElementById('progEmpty');
  const setEmpty=msg=>{summary.innerHTML='';charts.innerHTML='';empty.style.display='block';empty.querySelector('.empty').textContent=msg;};
  if(!progLoaded)return setEmpty('加载中…');
  const list=progFilterRange(progData);
  if(!list.length)return setEmpty('该时间范围内暂无训练记录');
  empty.style.display='none';

  const cards=[];
  BODY_METRICS.forEach(m=>{
    const pts=list.filter(l=>l[m.key]!=null&&l[m.key]!=='').map(l=>Number(l[m.key]));
    if(pts.length<1)return;
    cards.push(compareCard(m.label,m.unit,pts[0],pts[pts.length-1],m.good));
  });
  cards.push(compareCard('单次训练容量','kg',list[0].volume,list[list.length-1].volume,'up'));
  summary.innerHTML='<div class="compare-grid">'+cards.join('')+'</div>';

  let html='';
  BODY_METRICS.forEach(m=>{
    const pts=list.filter(l=>l[m.key]!=null&&l[m.key]!=='').map(l=>({x:l.date,y:Number(l[m.key])}));
    if(pts.length<2)return;
    html+=`<div class="chart-card"><h3>${m.label}趋势 <span style="font-size:12px;color:var(--muted);font-weight:700">${pts.length} 次测量</span></h3><div class="ch-sub">单位：${m.unit}</div>${lineChartSVG(pts,m.color)}</div>`;
  });
  const volPts=list.map(l=>({x:l.date,y:l.volume}));
  html+=`<div class="chart-card"><h3>每次训练容量 <span style="font-size:12px;color:var(--muted);font-weight:700">${volPts.length} 次</span></h3><div class="ch-sub">单位：kg（重量×次数×倍数累加）</div>${barChartSVG(volPts,'#7c3aed')}</div>`;
  charts.innerHTML=html;
}

function fmtNum(n){return (Math.round(n*10)/10).toString();}
function shortDate(d){return d?String(d).slice(5):'';}

function compareCard(label,unit,from,to,good){
  const delta=to-from, pct=from?delta/from*100:0;
  let cls='flat',arrow='→';
  if(Math.abs(delta)>1e-9){
    arrow=delta>0?'↑':'↓';
    if(good==='neutral')cls='flat';
    else if(good==='up')cls=delta>0?'up':'bad';
    else cls=delta<0?'up':'bad';
  }
  const deltaStr=(delta>0?'+':'')+fmtNum(delta)+unit+(from?` (${(pct>0?'+':'')+pct.toFixed(1)}%)`:'');
  return `<div class="compare-card"><div class="cc-label">${label}</div>
    <div class="cc-vals"><span class="cc-from">${fmtNum(from)}${unit}</span><span class="cc-arrow">→</span><span class="cc-to">${fmtNum(to)}${unit}</span></div>
    <div class="cc-delta ${cls}">${arrow} ${deltaStr}</div></div>`;
}

function lineChartSVG(points,color){
  const W=620,H=200,padL=46,padR=16,padT=18,padB=30,n=points.length;
  const ys=points.map(p=>p.y);let min=Math.min(...ys),max=Math.max(...ys);
  if(min===max){min-=1;max+=1;}else{const r=max-min;min-=r*0.12;max+=r*0.12;}
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xAt=i=>n===1?padL+plotW/2:padL+plotW*i/(n-1);
  const yAt=v=>padT+plotH*(1-(v-min)/(max-min));
  let grid='';
  for(let g=0;g<=2;g++){const v=min+(max-min)*g/2,y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef2ff"/>`;
    grid+=`<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${fmtNum(v)}</text>`;}
  const dLine=points.map((p,i)=>`${i?'L':'M'}${xAt(i).toFixed(1)},${yAt(p.y).toFixed(1)}`).join(' ');
  const dArea=`${dLine} L${xAt(n-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xAt(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  let dots='';points.forEach((p,i)=>{dots+=`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.y).toFixed(1)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`;});
  const lbl=(i)=>`<text x="${xAt(i).toFixed(1)}" y="${(yAt(points[i].y)-9).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="${color}">${fmtNum(points[i].y)}</text>`;
  let xl='';[...new Set([0,Math.floor((n-1)/2),n-1])].forEach(i=>{xl+=`<text x="${xAt(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#9ca3af">${shortDate(points[i].x)}</text>`;});
  const gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${dArea}" fill="url(#${gid})"/><path d="${dLine}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lbl(0)}${lbl(n-1)}${xl}</svg>`;
}

function barChartSVG(points,color){
  const W=620,H=200,padL=46,padR=16,padT=18,padB=30,n=points.length;
  let max=Math.max(...points.map(p=>p.y),1)*1.14;
  const plotW=W-padL-padR,plotH=H-padT-padB,slot=plotW/n,bw=Math.min(34,slot*0.6);
  const yAt=v=>padT+plotH*(1-v/max);
  let grid='';
  for(let g=0;g<=2;g++){const v=max*g/2,y=yAt(v);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef2ff"/>`;
    grid+=`<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(v)}</text>`;}
  let bars='';points.forEach((p,i)=>{const cx=padL+slot*i+slot/2,x=cx-bw/2,y=yAt(p.y),h=padT+plotH-y;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="${color}" opacity="0.85"/>`;
    if(n<=12)bars+=`<text x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${color}">${p.y}</text>`;});
  let xl='';const idxs=n<=8?points.map((_,i)=>i):[...new Set([0,Math.floor((n-1)/2),n-1])];
  idxs.forEach(i=>{const cx=padL+slot*i+slot/2;xl+=`<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#9ca3af">${shortDate(points[i].x)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}${xl}</svg>`;
}

init();
</script>
