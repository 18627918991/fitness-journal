<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>健身私教管理系统 · 登录</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 50%,#7c3aed 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .card{background:#fff;border-radius:24px;padding:44px 40px 36px;width:100%;max-width:400px;
      box-shadow:0 24px 64px rgba(15,23,42,.28)}
    .logo{width:56px;height:56px;border-radius:18px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
    h1{text-align:center;font-size:22px;color:#111827;margin-bottom:6px}
    .sub{text-align:center;color:#6b7280;font-size:13px;margin-bottom:32px}
    label{display:block;font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px}
    input{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;
      font:inherit;font-size:15px;outline:none;transition:.15s}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
    .field{margin-bottom:18px}
    .btn{width:100%;border:none;border-radius:12px;padding:14px;font:inherit;font-size:15px;
      font-weight:800;cursor:pointer;background:linear-gradient(135deg,#2563eb,#7c3aed);
      color:#fff;margin-top:6px;transition:.18s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .err{color:#dc2626;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
  </style>
  <link rel="stylesheet" href="/theme.css"/>
</head>
<body class="login-page">
<div class="card">
  <div class="logo">🏋️</div>
  <h1>健身私教管理系统</h1>
  <p class="sub">教练 · 学员 · 管理一体化平台</p>
  <div class="field"><label>手机号</label><input id="phone" type="tel" placeholder="请输入手机号" autocomplete="username"/></div>
  <div class="field"><label>密码</label><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"/></div>
  <button class="btn" onclick="login()">登 录</button>
  <div class="err" id="err"></div>
</div>
<script>
  document.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
  async function login(){
    const phone=document.getElementById('phone').value.trim();
    const password=document.getElementById('password').value;
    document.getElementById('err').textContent='';
    if(!phone||!password){document.getElementById('err').textContent='请填写账号和密码';return}
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});
      const data=await r.json();
      if(!r.ok){document.getElementById('err').textContent=data.error||'登录失败';return}
      const pages={admin:'/admin.html',coach:'/coach.html',student:'/student.html'};
      location.href=pages[data.role]||'/';
    }catch(e){document.getElementById('err').textContent='网络错误，请重试'}
  }
</script>
</body>
</html>
