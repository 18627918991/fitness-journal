<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人健身训练日志系统</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --card-soft: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
      --shadow: 0 14px 36px rgba(15, 23, 42, .08);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 280px, var(--bg) 100%);
    }

    button, input, select, textarea { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(229, 231, 235, .88);
      background: rgba(245, 247, 251, .9);
      backdrop-filter: blur(14px);
    }

    .topbar {
      width: min(1220px, calc(100% - 28px));
      margin: 0 auto;
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      font-weight: 900;
      flex: 0 0 auto;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .top-actions, .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 0;
      border-radius: var(--radius);
      padding: 10px 13px;
      background: #111827;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .12);
    }

    button.primary { background: var(--primary); }
    button.primary:hover { background: var(--primary-dark); }
    button.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    button.small { padding: 7px 9px; font-size: 12px; }

    main {
      width: min(1220px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 58px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .view { display: none; }
    .view.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
      align-items: start;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(229, 231, 235, .95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card + .card,
    .section-gap { margin-top: 16px; }

    .card h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 17px;
      line-height: 1.35;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(147, 197, 253, .22);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px;
      background: linear-gradient(180deg, #fff, #f9fafb);
    }

    .stat .name {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .stat .num {
      margin-top: 6px;
      font-size: 23px;
      line-height: 1.1;
      font-weight: 950;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 10px;
    }

    .warn {
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 10px;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .exercise-head {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 12px;
      padding: 13px;
      border-bottom: 1px solid var(--line);
      background: var(--card-soft);
    }

    .exercise-title-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .exercise-name-input {
      max-width: 260px;
      font-weight: 900;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      margin: 5px 4px 0 0;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .exercise-body { padding: 13px; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: center;
      font-size: 13px;
    }

    th {
      background: #f9fafb;
      color: var(--muted);
      font-size: 12px;
    }

    td input {
      padding: 8px;
      text-align: center;
    }

    .empty {
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      padding: 26px 14px;
      background: #fff;
      color: var(--muted);
      text-align: center;
    }

    .history-tools {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .history-list {
      max-height: 560px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 128px 1fr 240px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fff;
    }

    .history-title { font-weight: 950; }
    .history-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .bar-wrap {
      height: 9px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2ff;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      max-width: min(360px, calc(100% - 36px));
      border-radius: var(--radius);
      padding: 12px 14px;
      background: #111827;
      color: #fff;
      box-shadow: 0 12px 24px rgba(15, 23, 42, .25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .2s;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { justify-content: flex-start; }
      .grid, .grid-3 { grid-template-columns: 1fr; }
      .form-grid, .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .history-tools, .history-item { grid-template-columns: 1fr; }
      .exercise-head { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main, .topbar { width: min(100% - 20px, 1220px); }
      .form-grid, .stat-grid { grid-template-columns: 1fr; }
      .top-actions button, .tabs button { flex: 1; }
      th, td { padding: 6px; font-size: 12px; }
      .row-actions { justify-content: flex-start; }
    }

    @media print {
      header, .tabs, .top-actions, .row-actions, .no-print { display: none !important; }
      body { background: #fff; }
      main { width: 100%; padding: 0; }
      .card { box-shadow: none; break-inside: avoid; }
      .view { display: block; }
      #view-history, #view-weekly, #view-monthly { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo">H</div>
        <div>
          <h1>个人健身训练日志</h1>
          <div class="subtitle">每日记录、历史追踪、周/月总结、本地保存</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="secondary" type="button" onclick="exportAllJSON()">导出全部 JSON</button>
        <button class="secondary" type="button" onclick="document.getElementById('restoreInput').click()">导入恢复 JSON</button>
        <input id="restoreInput" type="file" accept="application/json,.json" hidden onchange="restoreJSON(event)">
        <button class="secondary" type="button" onclick="window.print()">打印/保存 PDF</button>
      </div>
    </div>
  </header>

  <main>
    <nav class="tabs no-print" aria-label="页面导航">
      <button class="tab active" type="button" onclick="switchView('today', this)">今日日志</button>
      <button class="tab" type="button" onclick="switchView('history', this)">历史记录</button>
      <button class="tab" type="button" onclick="switchView('weekly', this)">周总结</button>
      <button class="tab" type="button" onclick="switchView('monthly', this)">月总结</button>
    </nav>

    <section id="view-today" class="view active">
      <div class="grid">
        <section class="card">
          <h2>上传训练截图生成日志 <span class="pill" id="ocrPill">OCR 可选</span></h2>
          <div class="form-grid" style="grid-template-columns: 1fr auto auto;">
            <div>
              <label for="logImageInput">上传图片</label>
              <input type="file" id="logImageInput" accept="image/*">
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="primary" type="button" onclick="recognizeImage()">识别图片</button>
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="secondary" type="button" onclick="fillLogFromOCRBox()">用识别文字填入日志</button>
            </div>
          </div>
          <div class="warn" id="ocrStatus">OCR 文件未加载，可以手动粘贴识别文字后解析。</div>
          <div style="height: 10px"></div>
          <label for="ocrText">OCR 识别文字</label>
          <textarea id="ocrText" placeholder="可以上传训练截图识别，也可以直接粘贴文字。"></textarea>
        </section>

        <aside class="card">
          <h2>今日概览 <span class="pill" id="savedPill">草稿</span></h2>
          <div class="stat-grid" id="todayStats"></div>
          <p class="hint">核心动作如果重量为 0，会按次数统计；其他动作按 weight × reps × multiplier 计算容量。</p>
        </aside>
      </div>

      <section class="card">
        <h2>今日训练日志</h2>
        <div class="form-grid">
          <div><label for="dateInput">日期</label><input type="date" id="dateInput"></div>
          <div><label for="weekdayInput">星期</label><input id="weekdayInput" placeholder="周二"></div>
          <div><label for="titleInput">训练标题</label><input id="titleInput" placeholder="下肢 大强度"></div>
          <div><label for="durationInput">总耗时 min</label><input type="number" id="durationInput" min="0" placeholder="61"></div>
          <div><label for="caloriesInput">总消耗 kcal</label><input type="number" id="caloriesInput" min="0" placeholder="313"></div>
          <div><label for="weightInput">体重 kg</label><input type="number" step="0.1" id="weightInput"></div>
          <div><label for="fatInput">体脂率 %</label><input type="number" step="0.1" id="fatInput"></div>
          <div><label for="muscleInput">骨骼肌 kg</label><input type="number" step="0.1" id="muscleInput"></div>
        </div>
        <div style="height: 12px"></div>
        <label for="summaryInput">今日总结</label>
        <textarea id="summaryInput" placeholder="记录训练感受、动作状态、饮食睡眠、下次计划等。"></textarea>
      </section>

      <section class="card">
        <h2>训练动作管理 <span class="pill" id="exerciseCount">0 个动作</span></h2>
        <div class="form-grid">
          <div><label for="newExName">动作名称</label><input id="newExName" placeholder="悍马机臀冲"></div>
          <div>
            <label for="newExCategory">部位分类</label>
            <select id="newExCategory">
              <option value="lower_body">下肢</option>
              <option value="back">背部</option>
              <option value="shoulder">肩部</option>
              <option value="chest_arms">胸部/手臂</option>
              <option value="core">核心</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div><label for="newExMuscles">目标肌群</label><input id="newExMuscles" placeholder="臀大肌"></div>
          <div><label for="newExMultiplier">倍数 multiplier</label><input type="number" id="newExMultiplier" min="0" step="1" value="1"></div>
          <div><label for="newSetWeight">默认重量</label><input type="number" id="newSetWeight" step="0.5" value="0"></div>
          <div><label for="newSetReps">默认次数</label><input type="number" id="newSetReps" value="10"></div>
          <div><label for="newSetCount">默认组数</label><input type="number" id="newSetCount" min="1" value="4"></div>
          <div><label>&nbsp;</label><button class="primary" type="button" onclick="addExerciseFromForm()">添加动作</button></div>
        </div>
        <div style="height: 14px"></div>
        <div id="exerciseList" class="exercise-list"></div>
        <div id="emptyState" class="empty">还没有训练动作。可以手动添加，或用 OCR 文字填入日志。</div>
      </section>

      <section class="card">
        <h2>备份与操作</h2>
        <div class="row-actions">
          <button class="success" type="button" onclick="saveTodayToHistory()">保存/更新今天日志</button>
          <button class="secondary" type="button" onclick="exportCurrentJSON()">导出当前日志 JSON</button>
          <button class="secondary" type="button" onclick="exportCurrentMarkdown()">导出当前日志 Markdown</button>
          <button class="danger" type="button" onclick="clearCurrentLog()">清空当前日志</button>
        </div>
      </section>
    </section>

    <section id="view-history" class="view">
      <section class="card">
        <h2>历史记录 <span class="pill" id="historyCount">0 条</span></h2>
        <div class="history-tools">
          <div><label for="historyMonth">按月份筛选</label><input type="month" id="historyMonth" onchange="renderHistory()"></div>
          <div><label for="historyKeyword">关键词搜索</label><input id="historyKeyword" placeholder="臀冲、下肢、背部" oninput="renderHistory()"></div>
          <div>
            <label for="historySort">排序</label>
            <select id="historySort" onchange="renderHistory()">
              <option value="desc">日期从新到旧</option>
              <option value="asc">日期从旧到新</option>
            </select>
          </div>
          <button class="danger" type="button" onclick="clearHistory()">清空历史</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>

    <section id="view-weekly" class="view">
      <section class="card">
        <h2>周总结</h2>
        <div class="form-grid">
          <div><label for="weekPicker">选择周内任意一天</label><input type="date" id="weekPicker" onchange="renderWeekly()"></div>
        </div>
        <div class="section-gap" id="weeklyBox"></div>
      </section>
    </section>

    <section id="view-monthly" class="view">
      <section class="card">
        <h2>月总结</h2>
        <div class="form-grid">
          <div><label for="monthPicker">选择月份</label><input type="month" id="monthPicker" onchange="renderMonthly()"></div>
        </div>
        <div class="section-gap" id="monthlyBox"></div>
      </section>
    </section>

    <div class="footer">数据保存在浏览器 localStorage：hxx_fitness_history_v2。换手机或清缓存前，请先导出 JSON 备份。</div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const HISTORY_KEY = "hxx_fitness_history_v2";
    const DRAFT_KEY = "hxx_fitness_current_draft_v2";

    const categoryLabels = {
      lower_body: "下肢",
      back: "背部",
      shoulder: "肩部",
      chest_arms: "胸部/手臂",
      core: "核心",
      other: "其他"
    };

    const muscleMap = {
      "悍马机臀冲": "臀大肌",
      "臀冲": "臀大肌",
      "坐姿髋外展": "臀中肌、臀小肌",
      "髋外展": "臀中肌、臀小肌",
      "罗马尼亚硬拉": "腘绳肌、臀大肌、竖脊肌",
      "半程硬拉": "臀大肌、腘绳肌、背部",
      "下腹训练器": "下腹部、核心",
      "死虫": "腹横肌、深层核心"
    };

    const idMap = {
      "悍马机臀冲": "HIP_002",
      "坐姿髋外展": "HIP_001",
      "罗马尼亚硬拉": "DL_001",
      "半程硬拉": "DL_002",
      "下腹训练器": "CORE_001",
      "死虫": "CORE_001",
      "高位下拉": "BACK_001",
      "坐姿划船": "BACK_002",
      "哑铃推举": "SHOULDER_001",
      "哑铃侧平举": "SHOULDER_002",
      "哑铃卧推": "CHEST_001"
    };

    let currentLog = createEmptyLog();
    let history = [];
    let ocrScriptTried = false;

    function createEmptyLog() {
      const date = todayString();
      return {
        date,
        weekday: weekdayCN(date),
        title: "",
        duration: "",
        calories: "",
        body: { weight: "", fat: "", muscle: "" },
        exercises: [],
        summary: ""
      };
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function weekdayCN(dateStr) {
      if (!dateStr) return "";
      const names = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      return names[new Date(dateStr + "T00:00:00").getDay()] || "";
    }

    function safeNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function deepCopy(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function uid(prefix) {
      return `${prefix}_${Date.now().toString(36).slice(-6).toUpperCase()}${Math.floor(Math.random() * 90 + 10)}`;
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      window.setTimeout(() => el.classList.remove("show"), 1800);
    }

    function normalizeDate(value) {
      const match = String(value || "").match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
      if (!match) return "";
      return `${match[1]}-${match[2].padStart(2, "0")}-${match[3].padStart(2, "0")}`;
    }

    function bindInputs() {
      const ids = ["dateInput", "weekdayInput", "titleInput", "durationInput", "caloriesInput", "weightInput", "fatInput", "muscleInput", "summaryInput"];
      ids.forEach((id) => document.getElementById(id).addEventListener("input", syncFromInputs));
      document.getElementById("dateInput").addEventListener("change", () => {
        document.getElementById("weekdayInput").value = weekdayCN(document.getElementById("dateInput").value);
        syncFromInputs();
        document.getElementById("weekPicker").value = currentLog.date;
        document.getElementById("monthPicker").value = currentLog.date.slice(0, 7);
        renderWeekly();
        renderMonthly();
      });
    }

    function syncFromInputs() {
      currentLog.date = document.getElementById("dateInput").value;
      currentLog.weekday = document.getElementById("weekdayInput").value;
      currentLog.title = document.getElementById("titleInput").value;
      currentLog.duration = safeNumber(document.getElementById("durationInput").value) || "";
      currentLog.calories = safeNumber(document.getElementById("caloriesInput").value) || "";
      currentLog.body.weight = document.getElementById("weightInput").value;
      currentLog.body.fat = document.getElementById("fatInput").value;
      currentLog.body.muscle = document.getElementById("muscleInput").value;
      currentLog.summary = document.getElementById("summaryInput").value;
      saveDraft();
      renderTodayStats();
    }

    function syncToInputs() {
      document.getElementById("dateInput").value = currentLog.date || todayString();
      document.getElementById("weekdayInput").value = currentLog.weekday || weekdayCN(currentLog.date);
      document.getElementById("titleInput").value = currentLog.title || "";
      document.getElementById("durationInput").value = currentLog.duration || "";
      document.getElementById("caloriesInput").value = currentLog.calories || "";
      document.getElementById("weightInput").value = currentLog.body?.weight || "";
      document.getElementById("fatInput").value = currentLog.body?.fat || "";
      document.getElementById("muscleInput").value = currentLog.body?.muscle || "";
      document.getElementById("summaryInput").value = currentLog.summary || "";
    }

    function saveDraft() {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(currentLog));
      document.getElementById("savedPill").textContent = "草稿已保存";
    }

    function loadData() {
      try {
        const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        history = Array.isArray(parsed) ? parsed : [];
      } catch {
        history = [];
      }

      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
        if (draft && typeof draft === "object") currentLog = normalizeLog(draft);
      } catch {
        currentLog = createEmptyLog();
      }

      syncToInputs();
      document.getElementById("weekPicker").value = currentLog.date || todayString();
      document.getElementById("monthPicker").value = (currentLog.date || todayString()).slice(0, 7);
      document.getElementById("historyMonth").value = "";
      renderAll();
    }

    function normalizeLog(log) {
      return {
        date: log.date || todayString(),
        weekday: log.weekday || weekdayCN(log.date || todayString()),
        title: log.title || "",
        duration: log.duration ?? "",
        calories: log.calories ?? "",
        body: {
          weight: log.body?.weight ?? "",
          fat: log.body?.fat ?? "",
          muscle: log.body?.muscle ?? ""
        },
        exercises: Array.isArray(log.exercises) ? log.exercises.map(normalizeExercise) : [],
        summary: log.summary || ""
      };
    }

    function normalizeExercise(exercise) {
      return {
        id: exercise.id || idMap[exercise.name] || uid("EX"),
        name: exercise.name || "未命名动作",
        category: exercise.category || guessCategory(exercise.name || ""),
        muscles: exercise.muscles || guessMuscles(exercise.name || ""),
        multiplier: safeNumber(exercise.multiplier) || 1,
        sets: Array.isArray(exercise.sets) ? exercise.sets.map((set) => ({
          weight: safeNumber(set.weight),
          reps: safeNumber(set.reps),
          note: set.note || ""
        })) : []
      };
    }

    function saveHistory() {
      history.sort((a, b) => a.date.localeCompare(b.date));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function switchView(name, button) {
      document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
      document.getElementById(`view-${name}`).classList.add("active");
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
      button.classList.add("active");
      if (name === "history") renderHistory();
      if (name === "weekly") renderWeekly();
      if (name === "monthly") renderMonthly();
    }

    function categoryLabel(category) {
      return categoryLabels[category] || categoryLabels.other;
    }

    function exerciseVolume(exercise) {
      return (exercise.sets || []).reduce((sum, set) => {
        return sum + safeNumber(set.weight) * safeNumber(set.reps) * (safeNumber(exercise.multiplier) || 1);
      }, 0);
    }

    function exerciseReps(exercise) {
      return (exercise.sets || []).reduce((sum, set) => sum + safeNumber(set.reps), 0);
    }

    function exerciseLoad(exercise) {
      const volume = exerciseVolume(exercise);
      if (exercise.category === "core" && volume === 0) return exerciseReps(exercise);
      return volume;
    }

    function logTotalLoad(log) {
      return (log.exercises || []).reduce((sum, exercise) => sum + exerciseLoad(exercise), 0);
    }

    function renderAll() {
      renderTodayStats();
      renderExercises();
      renderHistory();
      renderWeekly();
      renderMonthly();
    }

    function renderTodayStats() {
      const stats = [
        ["动作", `${currentLog.exercises.length} 个`],
        ["总容量/次数", Math.round(logTotalLoad(currentLog)).toString()],
        ["总耗时", `${safeNumber(currentLog.duration)} min`],
        ["总消耗", `${safeNumber(currentLog.calories)} kcal`]
      ];
      document.getElementById("todayStats").innerHTML = stats.map(([name, num]) => `
        <div class="stat"><div class="name">${name}</div><div class="num">${num}</div></div>
      `).join("");
      document.getElementById("exerciseCount").textContent = `${currentLog.exercises.length} 个动作`;
    }

    function renderExercises() {
      const list = document.getElementById("exerciseList");
      const empty = document.getElementById("emptyState");
      empty.style.display = currentLog.exercises.length ? "none" : "block";
      list.innerHTML = currentLog.exercises.map((exercise, index) => {
        const rows = exercise.sets.map((set, setIndex) => `
          <tr>
            <td>第 ${setIndex + 1} 组</td>
            <td><input type="number" step="0.5" value="${set.weight}" oninput="updateSet(${index}, ${setIndex}, 'weight', this.value)"></td>
            <td><input type="number" step="1" value="${set.reps}" oninput="updateSet(${index}, ${setIndex}, 'reps', this.value)"></td>
            <td><input value="${escapeHTML(set.note)}" oninput="updateSet(${index}, ${setIndex}, 'note', this.value)" placeholder="备注"></td>
            <td><button class="danger small" type="button" onclick="deleteSet(${index}, ${setIndex})">删除</button></td>
          </tr>
        `).join("");

        return `
          <article class="exercise">
            <div class="exercise-head">
              <div>
                <div class="exercise-title-row">
                  <input class="exercise-name-input" value="${escapeHTML(exercise.name)}" oninput="updateExercise(${index}, 'name', this.value)">
                  <span class="tag">${categoryLabel(exercise.category)}</span>
                  <span class="tag">容量 ${Math.round(exerciseVolume(exercise))} kg</span>
                  <span class="tag">统计 ${Math.round(exerciseLoad(exercise))}</span>
                  <span class="tag">次数 ${exerciseReps(exercise)}</span>
                </div>
                <div class="hint">ID：${escapeHTML(exercise.id)}</div>
              </div>
              <div>
                <label>倍数 multiplier</label>
                <input type="number" min="0" step="1" value="${exercise.multiplier}" oninput="updateExercise(${index}, 'multiplier', this.value)">
              </div>
            </div>
            <div class="exercise-body">
              <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div>
                  <label>部位分类</label>
                  <select onchange="updateExercise(${index}, 'category', this.value)">
                    ${Object.entries(categoryLabels).map(([key, label]) => `<option value="${key}" ${exercise.category === key ? "selected" : ""}>${label}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label>目标肌群</label>
                  <input value="${escapeHTML(exercise.muscles)}" oninput="updateExercise(${index}, 'muscles', this.value)">
                </div>
              </div>
              <div style="height: 10px"></div>
              <table>
                <thead><tr><th>组</th><th>weight</th><th>reps</th><th>note</th><th>操作</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
              <div class="row-actions" style="margin-top: 12px">
                <button class="success small" type="button" onclick="addSet(${index})">添加一组</button>
                <button class="danger small" type="button" onclick="deleteExercise(${index})">删除动作</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function addExerciseFromForm() {
      const name = document.getElementById("newExName").value.trim();
      if (!name) {
        toast("请先填写动作名称");
        return;
      }
      const count = Math.max(1, safeNumber(document.getElementById("newSetCount").value) || 1);
      const weight = safeNumber(document.getElementById("newSetWeight").value);
      const reps = safeNumber(document.getElementById("newSetReps").value);
      currentLog.exercises.push({
        id: idMap[name] || uid("EX"),
        name,
        category: document.getElementById("newExCategory").value,
        muscles: document.getElementById("newExMuscles").value.trim() || guessMuscles(name),
        multiplier: safeNumber(document.getElementById("newExMultiplier").value) || 1,
        sets: Array.from({ length: count }, () => ({ weight, reps, note: "" }))
      });
      ["newExName", "newExMuscles"].forEach((id) => document.getElementById(id).value = "");
      renderAll();
      saveDraft();
      toast("动作已添加");
    }

    function updateExercise(index, field, value) {
      const exercise = currentLog.exercises[index];
      if (!exercise) return;
      if (field === "multiplier") exercise[field] = safeNumber(value) || 0;
      else exercise[field] = value;
      if (field === "name") {
        exercise.category = guessCategory(value);
        exercise.muscles = exercise.muscles || guessMuscles(value);
        exercise.id = exercise.id || idMap[value] || uid("EX");
      }
      renderAll();
      saveDraft();
    }

    function updateSet(exIndex, setIndex, field, value) {
      const set = currentLog.exercises[exIndex]?.sets?.[setIndex];
      if (!set) return;
      set[field] = field === "note" ? value : safeNumber(value);
      renderTodayStats();
      saveDraft();
    }

    function addSet(index) {
      const exercise = currentLog.exercises[index];
      if (!exercise) return;
      const last = exercise.sets[exercise.sets.length - 1] || { weight: 0, reps: 0, note: "" };
      exercise.sets.push({ weight: last.weight, reps: last.reps, note: "" });
      renderAll();
      saveDraft();
    }

    function deleteSet(exIndex, setIndex) {
      currentLog.exercises[exIndex]?.sets.splice(setIndex, 1);
      renderAll();
      saveDraft();
    }

    function deleteExercise(index) {
      if (!confirm("确定删除这个动作吗？")) return;
      currentLog.exercises.splice(index, 1);
      renderAll();
      saveDraft();
    }

    function saveTodayToHistory() {
      syncFromInputs();
      if (!currentLog.date) {
        toast("请填写日期");
        return;
      }
      const log = normalizeLog(deepCopy(currentLog));
      const existingIndex = history.findIndex((item) => item.date === log.date);
      if (existingIndex >= 0) history[existingIndex] = log;
      else history.push(log);
      saveHistory();
      renderAll();
      document.getElementById("savedPill").textContent = "已保存";
      toast("已保存/更新今天日志");
    }

    function clearCurrentLog() {
      if (!confirm("确定清空当前日志草稿吗？")) return;
      currentLog = createEmptyLog();
      syncToInputs();
      saveDraft();
      renderAll();
      toast("当前日志已清空");
    }

    function renderHistory() {
      const month = document.getElementById("historyMonth").value;
      const keyword = document.getElementById("historyKeyword").value.trim();
      const sort = document.getElementById("historySort").value;
      let list = history.slice();
      if (month) list = list.filter((log) => log.date.slice(0, 7) === month);
      if (keyword) list = list.filter((log) => JSON.stringify(log).includes(keyword));
      list.sort((a, b) => sort === "desc" ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
      document.getElementById("historyCount").textContent = `${list.length} 条`;
      document.getElementById("historyList").innerHTML = list.length ? list.map((log) => `
        <div class="history-item">
          <div>
            <strong>${escapeHTML(log.date)}</strong>
            <div class="history-meta">${escapeHTML(log.weekday || weekdayCN(log.date))}</div>
          </div>
          <div>
            <div class="history-title">${escapeHTML(log.title || "未命名训练")}</div>
            <div class="history-meta">${escapeHTML((log.exercises || []).map((ex) => ex.name).join("、"))}</div>
            <div class="history-meta">动作 ${(log.exercises || []).length} 个｜统计 ${Math.round(logTotalLoad(log))}｜${log.duration || 0} min｜${log.calories || 0} kcal</div>
          </div>
          <div class="row-actions">
            <button class="secondary small" type="button" onclick="loadHistoryLog('${log.date}')">载入编辑</button>
            <button class="secondary small" type="button" onclick="exportHistoryLog('${log.date}')">导出</button>
            <button class="danger small" type="button" onclick="deleteHistoryLog('${log.date}')">删除</button>
          </div>
        </div>
      `).join("") : `<div class="empty">暂无历史记录</div>`;
    }

    function loadHistoryLog(date) {
      const log = history.find((item) => item.date === date);
      if (!log) return;
      currentLog = normalizeLog(deepCopy(log));
      syncToInputs();
      saveDraft();
      renderAll();
      toast("已载入该日记录，可继续编辑");
    }

    function deleteHistoryLog(date) {
      if (!confirm(`确定删除 ${date} 的记录吗？`)) return;
      history = history.filter((item) => item.date !== date);
      saveHistory();
      renderAll();
      toast("历史记录已删除");
    }

    function clearHistory() {
      if (!confirm("确定清空全部历史记录吗？请确认已经导出 JSON 备份。")) return;
      history = [];
      saveHistory();
      renderAll();
      toast("历史已清空");
    }

    function getWeekRange(dateStr) {
      const date = new Date((dateStr || todayString()) + "T00:00:00");
      const day = date.getDay() || 7;
      const monday = new Date(date);
      monday.setDate(date.getDate() - day + 1);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return [monday.toISOString().slice(0, 10), sunday.toISOString().slice(0, 10)];
    }

    function categoryTotals(logs) {
      const totals = {};
      Object.keys(categoryLabels).forEach((key) => totals[key] = 0);
      logs.forEach((log) => {
        (log.exercises || []).forEach((exercise) => {
          const key = exercise.category || "other";
          totals[key] = (totals[key] || 0) + exerciseLoad(exercise);
        });
      });
      return totals;
    }

    function topExercises(logs) {
      const counts = {};
      logs.forEach((log) => {
        (log.exercises || []).forEach((exercise) => {
          counts[exercise.name] = (counts[exercise.name] || 0) + 1;
        });
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    }

    function renderSummary(targetId, logs, title) {
      const totalLoad = logs.reduce((sum, log) => sum + logTotalLoad(log), 0);
      const totalDuration = logs.reduce((sum, log) => sum + safeNumber(log.duration), 0);
      const totalCalories = logs.reduce((sum, log) => sum + safeNumber(log.calories), 0);
      const totals = categoryTotals(logs);
      const max = Math.max(1, ...Object.values(totals));
      const top = topExercises(logs);
      document.getElementById(targetId).innerHTML = `
        <h3>${escapeHTML(title)}</h3>
        <div style="height: 10px"></div>
        <div class="stat-grid">
          <div class="stat"><div class="name">训练天数</div><div class="num">${logs.length}</div></div>
          <div class="stat"><div class="name">总训练容量</div><div class="num">${Math.round(totalLoad)}</div></div>
          <div class="stat"><div class="name">总训练耗时</div><div class="num">${totalDuration} min</div></div>
          <div class="stat"><div class="name">总消耗</div><div class="num">${totalCalories} kcal</div></div>
        </div>
        <div class="grid section-gap">
          <div class="card" style="box-shadow: none">
            <h2>各部位容量分布</h2>
            ${Object.entries(categoryLabels).map(([key, label]) => `
              <div class="history-meta">
                <strong>${label}</strong> ${Math.round(totals[key] || 0)}
                <div class="bar-wrap"><div class="bar" style="width: ${Math.max(2, Math.round((totals[key] || 0) / max * 100))}%"></div></div>
              </div>
            `).join("")}
          </div>
          <div class="card" style="box-shadow: none">
            <h2>高频动作 Top 5</h2>
            ${top.length ? top.map(([name, count], index) => `
              <div class="history-item" style="grid-template-columns: 42px 1fr 70px">
                <strong>${index + 1}</strong><span>${escapeHTML(name)}</span><strong>${count} 次</strong>
              </div>
            `).join("") : `<div class="empty">暂无数据</div>`}
          </div>
        </div>
      `;
    }

    function renderWeekly() {
      const picked = document.getElementById("weekPicker").value || currentLog.date || todayString();
      const [start, end] = getWeekRange(picked);
      const logs = history.filter((log) => log.date >= start && log.date <= end);
      renderSummary("weeklyBox", logs, `${start} 至 ${end}`);
    }

    function renderMonthly() {
      const month = document.getElementById("monthPicker").value || (currentLog.date || todayString()).slice(0, 7);
      const logs = history.filter((log) => log.date.slice(0, 7) === month);
      renderSummary("monthlyBox", logs, month);
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("文件已导出");
    }

    function exportAllJSON() {
      downloadFile(`hxx_fitness_history_backup_${todayString()}.json`, JSON.stringify(history, null, 2), "application/json");
    }

    function exportCurrentJSON() {
      syncFromInputs();
      downloadFile(`fitness_log_${currentLog.date || todayString()}.json`, JSON.stringify(normalizeLog(currentLog), null, 2), "application/json");
    }

    function exportHistoryLog(date) {
      const log = history.find((item) => item.date === date);
      if (!log) return;
      downloadFile(`fitness_log_${date}.json`, JSON.stringify(log, null, 2), "application/json");
    }

    function logToMarkdown(log) {
      const lines = [];
      lines.push(`# ${log.date} ${log.weekday || ""} ${log.title || "训练日志"}`.trim());
      lines.push("");
      lines.push(`- 总耗时：${log.duration || 0} min`);
      lines.push(`- 总消耗：${log.calories || 0} kcal`);
      lines.push(`- 体重：${log.body?.weight || ""} kg`);
      lines.push(`- 体脂率：${log.body?.fat || ""}%`);
      lines.push(`- 骨骼肌：${log.body?.muscle || ""} kg`);
      lines.push(`- 总训练容量/次数：${Math.round(logTotalLoad(log))}`);
      lines.push("");
      lines.push("## 训练动作");
      (log.exercises || []).forEach((exercise, index) => {
        lines.push("");
        lines.push(`### ${index + 1}. ${exercise.name} [${exercise.id}]`);
        lines.push(`- 部位：${categoryLabel(exercise.category)}`);
        lines.push(`- 目标肌群：${exercise.muscles || ""}`);
        lines.push(`- 倍数：${exercise.multiplier}`);
        lines.push(`- 动作容量：${Math.round(exerciseVolume(exercise))} kg`);
        exercise.sets.forEach((set, setIndex) => {
          lines.push(`- 第 ${setIndex + 1} 组：${set.weight}kg x ${set.reps}${set.note ? `，备注：${set.note}` : ""}`);
        });
      });
      lines.push("");
      lines.push("## 今日总结");
      lines.push(log.summary || "");
      return lines.join("\n");
    }

    function exportCurrentMarkdown() {
      syncFromInputs();
      downloadFile(`fitness_log_${currentLog.date || todayString()}.md`, logToMarkdown(normalizeLog(currentLog)), "text/markdown;charset=utf-8");
    }

    function restoreJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const list = Array.isArray(parsed) ? parsed : parsed.history;
          if (!Array.isArray(list)) throw new Error("JSON 必须是历史记录数组，或包含 history 数组。");
          history = list.map(normalizeLog);
          saveHistory();
          renderAll();
          toast("历史记录已恢复");
        } catch (error) {
          alert(`恢复失败：${error.message}`);
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function guessCategory(name) {
      if (/臀冲|髋外展|硬拉|腿举|深蹲|腿弯举|腿屈伸/.test(name)) return "lower_body";
      if (/下拉|划船|引体|背/.test(name)) return "back";
      if (/推举|侧平举|肩/.test(name)) return "shoulder";
      if (/卧推|夹胸|弯举|下压|臂屈伸/.test(name)) return "chest_arms";
      if (/腹|核心|卷腹|平板|死虫/.test(name)) return "core";
      return "other";
    }

    function guessMuscles(name) {
      for (const [key, value] of Object.entries(muscleMap)) {
        if (name.includes(key)) return value;
      }
      return "";
    }

    function guessId(name) {
      for (const [key, value] of Object.entries(idMap)) {
        if (name.includes(key)) return value;
      }
      return uid("EX");
    }

    function parseDuration(text) {
      const hourMinute = text.match(/(\d+)\s*h\s*(\d+)\s*m/i);
      if (hourMinute) return safeNumber(hourMinute[1]) * 60 + safeNumber(hourMinute[2]);
      const minute = text.match(/(\d+)\s*(?:min|分钟)/i);
      if (minute) return safeNumber(minute[1]);
      return "";
    }

    function parseCalories(text) {
      const patterns = [
        /(?:消耗|热量)\s*(\d{1,5})/i,
        /(\d{1,5})\s*(?:kcal|大卡|千卡)/i
      ];
      for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) return safeNumber(match[1]);
      }
      return "";
    }

    function parseSetText(block) {
      const sets = [];
      const regex = /(?:^|\s)(?:第?\s*\d+\s*)?(\((\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)\)|(\d+(?:\.\d+)?))\s*kg\s*[xX*]\s*(\d+)/g;
      let match;
      while ((match = regex.exec(block)) !== null) {
        if (match[2] && match[3]) {
          const raw = `${match[1]}kgx${match[5]}`;
          sets.push({
            weight: safeNumber(match[2]),
            reps: safeNumber(match[5]),
            note: `原始记录：${raw}`
          });
        } else {
          sets.push({
            weight: safeNumber(match[4]),
            reps: safeNumber(match[5]),
            note: ""
          });
        }
      }
      return sets;
    }

    function looksLikeExerciseHeader(line) {
      if (/kg\s*[xX*]\s*\d+/.test(line)) return false;
      return /^\d+\s+[\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z\s（）()·-]{1,30}$/.test(line);
    }

    function parseOCRText(text) {
      const original = String(text || "");
      const normalized = original
        .replace(/\r/g, "\n")
        .replace(/×/g, "x")
        .replace(/[，,]/g, " ")
        .replace(/[：:]/g, " ")
        .replace(/\n{2,}/g, "\n");

      const lines = normalized.split("\n").map((line) => line.trim()).filter(Boolean);
      const allText = lines.join(" ");

      const date = normalizeDate(allText) || currentLog.date || todayString();
      const weekday = (allText.match(/周[一二三四五六日天]/) || [""])[0].replace("周天", "周日") || weekdayCN(date);
      const duration = parseDuration(allText);
      const calories = parseCalories(allText);

      let title = "";
      const dateLineIndex = lines.findIndex((line) => normalizeDate(line));
      for (let i = Math.max(0, dateLineIndex + 1); i < lines.length; i += 1) {
        const line = lines[i];
        if (/胡晓雪|消耗|总重量|总容量|kg\s*x|kcal|大卡|^\d+\s/.test(line)) continue;
        if (line.length <= 20) {
          title = line;
          break;
        }
      }
      if (!title) {
        const titleMatch = allText.match(/(下肢|上肢|背部|肩部|胸部|核心|臀腿)\s*(大强度|中强度|小强度|训练)?/);
        title = titleMatch ? titleMatch[0].trim() : currentLog.title || "训练日志";
      }

      const exercises = [];
      for (let i = 0; i < lines.length; i += 1) {
        if (!looksLikeExerciseHeader(lines[i])) continue;
        const headerMatch = lines[i].match(/^\d+\s+(.+)$/);
        if (!headerMatch) continue;
        const name = headerMatch[1].trim();
        const blockLines = [];
        for (let j = i + 1; j < lines.length; j += 1) {
          if (looksLikeExerciseHeader(lines[j])) break;
          blockLines.push(lines[j]);
        }
        const block = blockLines.join(" ");
        const sets = parseSetText(block);
        if (!sets.length) continue;
        const hasPairWeight = sets.some((set) => /^原始记录：\(/.test(set.note));
        exercises.push({
          id: guessId(name),
          name,
          category: guessCategory(name),
          muscles: guessMuscles(name),
          multiplier: hasPairWeight ? 2 : 1,
          sets
        });
      }

      return normalizeLog({
        date,
        weekday,
        title,
        duration: duration || currentLog.duration || "",
        calories: calories || currentLog.calories || "",
        body: currentLog.body || { weight: "", fat: "", muscle: "" },
        exercises: exercises.length ? exercises : currentLog.exercises,
        summary: exercises.length
          ? "由 OCR 文字解析生成，请检查动作、重量、次数和备注是否准确。"
          : `OCR 解析未识别出完整动作，请手动修改识别文字。\n\n原始 OCR：\n${original}`
      });
    }

    function fillLogFromOCRBox() {
      const text = document.getElementById("ocrText").value;
      if (!text.trim()) {
        toast("请先粘贴或识别文字");
        return;
      }
      try {
        currentLog = parseOCRText(text);
        syncToInputs();
        saveDraft();
        renderAll();
        toast("已用识别文字填入日志，请检查");
      } catch (error) {
        document.getElementById("summaryInput").value = `OCR 解析失败，请手动修改。\n\n${text}`;
        syncFromInputs();
        toast("解析失败，已保留原文字");
      }
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function ensureOCRLoaded() {
      if (window.Tesseract) return true;
      if (!ocrScriptTried) {
        ocrScriptTried = true;
        try {
          await loadScript("assets/tesseract.min.js");
        } catch {
          return false;
        }
      }
      return Boolean(window.Tesseract);
    }

    async function recognizeImage() {
      const input = document.getElementById("logImageInput");
      const status = document.getElementById("ocrStatus");
      if (!input.files || !input.files[0]) {
        toast("请先选择图片");
        return;
      }

      const available = await ensureOCRLoaded();
      if (!available) {
        status.textContent = "OCR 文件未加载，可以手动粘贴识别文字后解析。";
        document.getElementById("ocrPill").textContent = "OCR 未加载";
        return;
      }

      status.textContent = "正在识别图片，首次加载离线 OCR 文件可能较慢。";
      try {
        const result = await Tesseract.recognize(input.files[0], "chi_sim+eng", {
          workerPath: "assets/worker.min.js",
          corePath: "assets/tesseract-core.wasm.js",
          langPath: "tessdata",
          logger(message) {
            if (message.status) {
              const progress = Math.round((message.progress || 0) * 100);
              status.textContent = `OCR：${message.status} ${progress}%`;
            }
          }
        });
        document.getElementById("ocrText").value = result?.data?.text || "";
        status.textContent = "识别完成。请检查文字后点击“用识别文字填入日志”。";
        document.getElementById("ocrPill").textContent = "OCR 已加载";
      } catch (error) {
        status.textContent = `OCR 识别失败：${error.message}。OCR 文件未加载，可以手动粘贴识别文字后解析。`;
      }
    }

    window.addEventListener("error", (event) => {
      const status = document.getElementById("ocrStatus");
      if (status && /tesseract|worker|wasm|traineddata/i.test(event.message || "")) {
        status.textContent = "OCR 文件未加载，可以手动粘贴识别文字后解析。";
      }
    });

    bindInputs();
    loadData();
  </script>
</body>
</html>
